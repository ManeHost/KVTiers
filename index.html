<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MCTiers — Minecraft PvP Rankings</title>
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚔️</text></svg>"
    />
  </head>
  <body>
    <div class="bg-glow"></div>

    <header class="header">
      <div class="header-left">
        <div class="logo">
          <span class="logo-icon">⚔️</span>
          <span class="logo-text">KV<span class="accent">TIERS</span></span>
        </div>
        <nav class="nav-links">
          <a href="#" class="active" data-page="rankings">Rankings</a>
          <a href="#" data-page="info">Information</a>
        </nav>
      </div>
      <div class="header-right">
        <div class="server-ip" title="Скопировать IP">
          <span class="ip-label">Server IP</span>
          <span class="ip-value" id="serverIp">kvota.pvp</span>
        </div>
        <div class="search-box">
          <input
            type="text"
            id="searchInput"
            placeholder="Search player..."
            autocomplete="off"
          />
          <span class="search-icon">🔍</span>
        </div>
      </div>
    </header>

    <main class="main">
      <!-- Gamemode Tabs -->
      <div class="tabs-container">
        <div class="tabs" id="gamemodeTabs">
          <button class="tab active" data-mode="overall">Overall</button>
          <!-- Tabs will be generated by JS -->
        </div>
      </div>

      <!-- Rankings Table -->
      <div class="rankings-panel">
        <div class="panel-header">
          <h1 id="pageTitle">Overall Rankings</h1>
          <div class="stats"><span id="playerCount">0</span> players</div>
        </div>

        <div class="table-wrapper">
          <table class="rankings-table" id="rankingsTable">
            <thead>
              <tr>
                <th class="col-rank">#</th>
                <th class="col-player">Player</th>
                <th class="col-region">Region</th>
                <th class="col-tiers" id="tiersHeader">Tiers</th>
              </tr>
            </thead>
            <tbody id="rankingsBody">
              <!-- Filled by JS -->
            </tbody>
          </table>
        </div>
      </div>
    </main>

    <!-- Player Modal -->
    <div class="modal-overlay" id="playerModal">
      <div class="modal">
        <button class="modal-close" id="modalClose">&times;</button>
        <div class="modal-header">
          <img id="modalAvatar" class="modal-avatar" src="" alt="avatar" />
          <div class="modal-info">
            <h2 id="modalName">Player</h2>
            <div class="modal-region" id="modalRegion">EU</div>
            <div class="modal-points" id="modalPoints">0 points</div>
          </div>
        </div>
        <div class="modal-tiers" id="modalTiers">
          <!-- Tiers grid -->
        </div>
      </div>
    </div>

    <footer class="footer">
      <p>
        MCTiers Purple Edition • Not affiliated with official MCTiers • Made for
        community
      </p>
    </footer>

    <script src="data.js"></script>
    <script src="app.js"></script>
  </body>
</html>
